name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executable:
    name: Windows executable (Python 3.13, x64)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      YARAXGUI_BUILD_NO_PAUSE: "1"
    steps:
      - name: Preserve bundled reference line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            modules/yarax-editor/pyproject.toml

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Build with the Windows entry point
        shell: cmd
        env:
          YARAXGUI_BUILD_INTERPRETER: ${{ steps.python.outputs.python-path }}
        run: call compile_to_exe.bat "%YARAXGUI_BUILD_INTERPRETER%"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YaraXGUI-windows-x64
          path: dist/YaraXGUI.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
